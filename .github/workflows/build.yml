name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "github-actions"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --no-deps -r requirements.txt

      # 把 ok-script / pyappify 内联成项目内目录，并把 tag 写回 src/config.py 的 version
      - name: Inline ok-script
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      # 按 deploy.txt 同步到独立更新库，并打同名 tag，用户端据此增量更新
      - name: Sync update repo
        id: sync
        uses: ok-oldking/partial-sync-repo@master
        with:
          repos: |
            https://dyyyyy-1:${{ secrets.UPDATE_REPO_TOKEN }}@github.com/dyyyyy-1/mc-update.git
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true

      - name: Build installer with PyAppify
        id: build-app
        uses: ok-oldking/pyappify-action@master

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          body: |
            ### 更新日志 ${{ steps.sync.outputs.start_tag }} -> ${{ steps.sync.outputs.end_tag }}
            ${{ steps.sync.outputs.changes_with_asterisk }}

            ### 下载
            首次使用请下载 `mc-auto-win32-Global-setup.exe` 安装；已安装用户可直接在应用内检查更新。
          files: pyappify_dist/*
